  primary: architecture-map
  supporting: []
- id: casual-explanation-id
  kind: contextual
  prompt: Aku masih bingung alur request dari API sampai data tersimpan. Tolong jelaskan
    pelan-pelan dari source yang ada, tanpa mengubah kode.
  interaction: automatic
  primary: architecture-map
  supporting: []
  message_expectations:
    language: id
    question: forbidden
    max_words: 65
