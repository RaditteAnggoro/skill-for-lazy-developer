cases:
- id: failing-unit-test
  kind: direct
  prompt: The invoice calculation test fails after the latest change. Find the cause,
    fix it, and run the relevant checks.
  interaction: automatic
  primary: systematic-debugging
  supporting:
  - verification-before-completion
  message_expectations:
    language: en
    question: forbidden
    max_words: 55
- id: browser-refresh-failure
  kind: contextual
  prompt: The dashboard becomes blank after a browser refresh. Reproduce it, fix the
    cause, and verify the original flow.
  interaction: automatic
  primary: browser-diagnostics
  supporting:
  - systematic-debugging
  - verification-before-completion
- id: browser-performance-investigation
  kind: direct
  prompt: Measure why the product page is slow in the browser and report console,
    network, and rendering evidence. Do not edit code.
  interaction: automatic
  primary: browser-diagnostics
  supporting: []
  message_expectations:
    language: en
    question: forbidden
    max_words: 55
- id: clear-label-change
  kind: direct
  prompt: Change the submit button label to Save and update the existing test.
  interaction: automatic
  primary: lean-senior-engineering
  supporting:
  - verification-before-completion
- id: documentation-typo
  kind: negative-control
  prompt: Correct the misspelled product name in README.md. Do not change application
    code.
  interaction: automatic
  primary: lean-senior-engineering
  supporting: []
- id: static-ui-change
  kind: direct
  prompt: Move the account summary heading above the balance card. The desired layout
    is already shown in the attached design.
  interaction: automatic
  primary: ui-implementation
  supporting:
  - verification-before-completion
- id: diagnose-only
  kind: negative-control
  prompt: Explain why this build fails, but do not change any files.
  interaction: automatic
  primary: systematic-debugging
  supporting: []
  message_expectations:
    language: en
    question: forbidden
    max_words: 45
- id: indonesian-failing-test
  kind: contextual
  prompt: Test perhitungan invoice gagal setelah perubahan terakhir. Cari penyebabnya,
    perbaiki, lalu jalankan pengecekan yang relevan.
  interaction: automatic
  primary: systematic-debugging
  supporting:
  - verification-before-completion
  message_expectations:
    language: id
    question: forbidden
    max_words: 55
- id: architecture-only
  kind: negative-control
  prompt: Trace how a campaign request is validated, stored, queued, and returned.
