<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="578" viewBox="0 0 1000 578" role="img" aria-labelledby="title desc">
  <title id="title">Skills for Lazy Developer V4 workflow</title>
  <desc id="desc">A request goes through the adaptive router, which selects current project source, relevant project memory, and native or authorized MCP tools as needed. One agent works through the selected phases and reports the result. Financial work follows a dedicated path from staging through claiming, posting, and reconciliation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#14333a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#9cb8ca" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1000" height="578" rx="24" fill="url(#background)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="38" y="52" fill="#f3f7ff" font-size="33" font-weight="700">Skills for Lazy Developer V4</text>
    <text x="39" y="82" fill="#b7c9d9" font-size="19">Select the evidence each task needs</text>

    <g fill="none" stroke="#9cb8ca" stroke-width="1.8">
      <path d="M286 139H319" marker-end="url(#arrow)"/>
      <path d="M675 139H710" marker-end="url(#arrow)"/>
      <path d="M499 171V199H182V217" marker-end="url(#arrow)"/>
      <path d="M499 199V217" marker-end="url(#arrow)"/>
      <path d="M499 199H816V217" marker-end="url(#arrow)"/>
      <path d="M182 335V355H816V335"/>
      <path d="M499 335V375" marker-end="url(#arrow)"/>
    </g>

    <rect x="38" y="107" width="248" height="64" rx="12" fill="#1a293d" stroke="#405369"/>
    <text x="57" y="134" fill="#f3f7ff" font-size="19" font-weight="650">Request</text>
    <text x="57" y="155" fill="#b7c9d9" font-size="15.5">Outcome and permissions</text>

    <rect x="323" y="107" width="352" height="64" rx="12" fill="#2a2d51" stroke="#7f79c1"/>
    <text x="343" y="134" fill="#f3f7ff" font-size="19" font-weight="650">Adaptive workflow</text>
    <text x="343" y="155" fill="#d4d2ec" font-size="15.5">Selects skills and phase boundaries</text>

    <rect x="714" y="107" width="248" height="64" rx="12" fill="#1a293d" stroke="#405369"/>
    <text x="734" y="134" fill="#f3f7ff" font-size="19" font-weight="650">Phase plan</text>
    <text x="734" y="155" fill="#b7c9d9" font-size="15.5">Dependencies and evidence</text>

    <rect x="38" y="221" width="288" height="114" rx="12" fill="#193042" stroke="#5a839c"/>
    <text x="58" y="252" fill="#b2e3fb" font-size="21" font-weight="700">Project source</text>
    <text x="58" y="278" fill="#e0eaf3" font-size="16">Native reads or local index</text>
    <text x="58" y="303" fill="#c1d2e0" font-size="16">Revision-checked excerpts</text>

    <rect x="355" y="221" width="288" height="114" rx="12" fill="#272d47" stroke="#7778a8"/>
    <text x="375" y="252" fill="#d7ceff" font-size="21" font-weight="700">Project memory</text>
    <text x="375" y="278" fill="#e0eaf3" font-size="16">Relevant history on resume</text>
    <text x="375" y="303" fill="#c1d2e0" font-size="16">Root scope and freshness</text>

    <rect x="672" y="221" width="290" height="114" rx="12" fill="#173840" stroke="#508a87"/>
    <text x="692" y="252" fill="#a5ebda" font-size="21" font-weight="700">Native and MCP tools</text>
    <text x="692" y="278" fill="#e0eaf3" font-size="16">Authorized capability discovery</text>
    <text x="692" y="303" fill="#c1d2e0" font-size="16">Native fallback when available</text>

    <rect x="38" y="379" width="924" height="62" rx="12" fill="#1b2d3c" stroke="#567587"/>
    <text x="58" y="417" fill="#f3f7ff" font-size="20" font-weight="650">Execute the selected phases</text>
    <text x="941" y="416" text-anchor="end" fill="#c1d2e0" font-size="16">Preserve constraints and report evidence</text>

    <rect x="38" y="463" width="924" height="83" rx="14" fill="#303121" stroke="#93835a"/>
    <text x="58" y="495" fill="#f6dfaa" font-size="20" font-weight="700">Financial engineering</text>
    <text x="58" y="521" fill="#e7e0ce" font-size="15.5">Spring Batch, PostgreSQL, Oracle</text>
    <g fill="none" stroke="#b6aa8e" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M560 506H580"/>
      <path d="M668 506H688"/>
      <path d="M771 506H791"/>
    </g>
    <g fill="#3f3e2e" stroke="#a29573">
      <rect x="467" y="487" width="90" height="38" rx="8"/>
      <rect x="583" y="487" width="82" height="38" rx="8"/>
      <rect x="691" y="487" width="77" height="38" rx="8"/>
      <rect x="794" y="487" width="148" height="38" rx="8"/>
    </g>
    <g fill="#f6ebd3" font-size="16" font-weight="650" text-anchor="middle">
      <text x="512" y="512">Stage</text>
      <text x="624" y="512">Claim</text>
      <text x="730" y="512">Post</text>
      <text x="868" y="512">Reconcile</text>
    </g>
  </g>
</svg>
