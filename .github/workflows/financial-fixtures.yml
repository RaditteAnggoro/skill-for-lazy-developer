name: Verify enterprise financial fixtures

on:
  push:
    paths:
      - '.agents/skills/transaction-safe-engineering/**'
      - 'tests/enhancement/fixtures/enterprise-batch/**'
      - '.github/workflows/financial-fixtures.yml'
  pull_request:
    paths:
      - '.agents/skills/transaction-safe-engineering/**'
      - 'tests/enhancement/fixtures/enterprise-batch/**'
      - '.github/workflows/financial-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-postgresql:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: tests/enhancement/fixtures/enterprise-batch/pom.xml
      - name: Run disposable PostgreSQL and Spring Batch tests
        run: mvn -B -ntp -f tests/enhancement/fixtures/enterprise-batch/pom.xml test
