name: Validate UI fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tests/ui/package-lock.json
            tests/ui/fixtures/react/package-lock.json
            tests/ui/fixtures/next/package-lock.json
      - name: Install UI runner
        working-directory: tests/ui
        run: npm ci
      - name: Install React fixture
        working-directory: tests/ui/fixtures/react
        run: npm ci && npm run build
      - name: Install Next fixture
        working-directory: tests/ui/fixtures/next
        run: npm ci && npm run build
      - name: Install Chromium
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium
      - name: Run structural browser checks
        working-directory: tests/ui
        env:
          UI_SNAPSHOT_MODE: structural
        run: |
          export UI_BROWSER_EXECUTABLE="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")"
          npm run check
          npm run check:next
